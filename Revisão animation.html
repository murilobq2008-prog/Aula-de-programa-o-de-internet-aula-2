<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            animation: rodar 1s linear 0s infinite;
        }
        @keyframes rodar {
            0%{
            transform: rotate(0deg);

            }
            100%{
                transform: rotate(360deg);

            }
        }
        #A{
            background-color: red;
            animation: pula 4s linear 0s infinite;
            
        }
        @keyframes pula {
        0%     {
            transform: translate(0,0);
            color: blue;
        }     
        10%{
            transform: translate(30px,30px);
            color: aqua;
        }  
        20%{
            transform: translate(60px,0px);
            color: green;
        }  
        30%{
            transform: translate(90px,30px);
            color: black;
        }  
        40%{
            transform: translate(120xp,0px);
            color: red;
        }  
        }
        
    </style>
</head>
<body>
    <div class="container">

        <div class="letra" id="A">A</div>
    </div>
</body>
</html>
