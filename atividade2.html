<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid black;}
        html{background-color: green;
            padding: 0px;
            margin: 0px;
            
        }
        body{
            margin: 0px;
            background-color: green;
        }
        p{
            display: inline-block;
            width: 100px;
            height: 100px;
            padding: 10px;
            outline: 2px dotted red;
            outline-offset: 40px;

            background-image: url("https://i.pinimg.com/736x/af/3e/ed/af3eeda017287cbe230ed00c4c76afbd.jpg");
            background-attachment: fixed;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: 0px 50px ;

        }
        #Yasmin{margin: 50px;

            border-top-color: blue;
        }
        span{line-height: 50px;}
    </style>
</head>
<body>
    <p>Thiago </p>
    <p>Murilão</p>
    <p id="Yasmin">Yasmin</p>
    <span>Ezequiel</span>
    <span> Y</span>
    <span> P</span>
</body>
</html>
