<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #rocket{
            position: fixed;
            animation: lancamento 10s ease-in 0s infinite;
        }
    @keyframes lancamento {
        0%{

            top: 100vh;
        }
        
    100%{
        top: 10vh;
    }

}
   #potato{
    width: 50px;
    animation: girar 2s cubic-bezier(.04,2.16,86,0.75) 0s 5;
   }
@keyframes girar {
    0%{
        transform: rotate(0deg);
    }
    100%{
        transform: rotate(300deg);
    }
    
}
</style>
</head>

<body>
    <p id="potato">potato.png</p>
    <p id = "rocket">🚀</p>
</body>
</html>
